  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative file path within the public search paths.
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within the private object dir (e.g. `uploads/some-uuid`).
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  schemas:
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file (e.g. `image/jpeg`).
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
          description: Presigned GCS URL for PUT upload.
        objectPath:
          type: string
          description: Normalized object path (e.g. `/objects/uploads/uuid`). Store this in your database.
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ── Auth ──────────────────────────────────────────────────────────────
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        role:
          type: string
          enum: [master_admin, company_admin, company_staff, driver, customer]

    AuthResult:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required: [id, email, name, role]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
        companyId:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        avatar:
          type: ["string", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string

    UserInput:
      type: object
      required: [email, name, role, password]
      properties:
        email:
          type: string
        name:
          type: string
        role:
          type: string
        password:
          type: string
        phone:
          type: string

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
        phone:
          type: string
        isActive:
          type: boolean

    # ── Master Dashboard ───────────────────────────────────────────────────
    MasterDashboardStats:
      type: object
      required: [totalCompanies, activeCompanies, expiredPlans, totalRevenue, monthlyRevenue, totalBookings, totalUsers]
      properties:
        totalCompanies:
          type: integer
        activeCompanies:
          type: integer
        expiredPlans:
          type: integer
        totalRevenue:
          type: number
        monthlyRevenue:
          type: number
        totalBookings:
          type: integer
        totalUsers:
          type: integer
        activeDrivers:
          type: integer

    # ── Company ────────────────────────────────────────────────────────────
    Company:
      type: object
      required: [id, name, email, status, plan]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, suspended, trial, expired]
        plan:
          type: string
        domain:
          type: ["string", "null"]
        logo:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        gstNumber:
          type: ["string", "null"]
        totalBookings:
          type: integer
        totalUsers:
          type: integer
        createdAt:
          type: string
        trialEndsAt:
          type: ["string", "null"]
        planExpiresAt:
          type: ["string", "null"]

    CompanyInput:
      type: object
      required: [name, email, plan]
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        plan:
          type: string
        city:
          type: string
        country:
          type: string
        domain:
          type: string

    CompanyUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        plan:
          type: string
        status:
          type: string
        domain:
          type: string
        city:
          type: string

    CompanyListResult:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Company"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    # ── Subscription Plan ──────────────────────────────────────────────────
    SubscriptionPlan:
      type: object
      required: [id, name, price, duration, maxUsers, maxVehicles]
      properties:
        id:
          type: string
        name:
          type: string
        price:
          type: number
        duration:
          type: integer
        maxUsers:
          type: integer
        maxVehicles:
          type: integer
        maxBookingsPerMonth:
          type: integer
        features:
          type: array
          items:
            type: string
        isActive:
          type: boolean
        createdAt:
          type: string

    SubscriptionPlanInput:
      type: object
      required: [name, price, duration, maxUsers, maxVehicles]
      properties:
        name:
          type: string
        price:
          type: number
        duration:
          type: integer
        maxUsers:
          type: integer
        maxVehicles:
          type: integer
        maxBookingsPerMonth:
          type: integer
        features:
          type: array
          items:
            type: string

    SubscriptionPlanUpdate:
      type: object
      properties:
        name:
          type: string
        price:
          type: number
        isActive:
          type: boolean
        maxUsers:
          type: integer
        maxVehicles:
          type: integer

    # ── Company Dashboard ──────────────────────────────────────────────────
    CompanyDashboardStats:
      type: object
      required: [todayBookings, todayRevenue, monthlyRevenue, activeTrips, availableDrivers, totalVehicles]
      properties:
        todayBookings:
          type: integer
        todayRevenue:
          type: number
        monthlyRevenue:
          type: number
        activeTrips:
          type: integer
        availableDrivers:
          type: integer
        totalVehicles:
          type: integer
        pendingLeads:
          type: integer
        pendingQuotations:
          type: integer
        overdueInvoices:
          type: integer

    RevenueTrendPoint:
      type: object
      required: [month, revenue, bookings]
      properties:
        month:
          type: string
        revenue:
          type: number
        bookings:
          type: integer

    # ── Booking ────────────────────────────────────────────────────────────
    Booking:
      type: object
      required: [id, bookingNumber, type, status, pickupDate, pickupLocation, dropLocation, customerName, amount]
      properties:
        id:
          type: string
        bookingNumber:
          type: string
        type:
          type: string
          enum: [local_cab, airport_transfer, outstation, tour, corporate, wedding, hourly]
        status:
          type: string
          enum: [enquiry, confirmed, assigned, in_progress, completed, cancelled]
        pickupDate:
          type: string
        pickupLocation:
          type: string
        dropLocation:
          type: string
        customerName:
          type: string
        customerPhone:
          type: ["string", "null"]
        amount:
          type: number
        advancePaid:
          type: number
        driverName:
          type: ["string", "null"]
        vehicleNumber:
          type: ["string", "null"]
        vehicleCategory:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    BookingInput:
      type: object
      required: [type, pickupDate, pickupLocation, dropLocation, customerName, amount]
      properties:
        type:
          type: string
        pickupDate:
          type: string
        pickupLocation:
          type: string
        dropLocation:
          type: string
        customerName:
          type: string
        customerPhone:
          type: string
        amount:
          type: number
        advancePaid:
          type: number
        customerId:
          type: string
        vehicleCategoryId:
          type: string
        notes:
          type: string

    BookingUpdate:
      type: object
      properties:
        status:
          type: string
        pickupDate:
          type: string
        amount:
          type: number
        notes:
          type: string

    BookingAssignment:
      type: object
      required: [driverId, vehicleId]
      properties:
